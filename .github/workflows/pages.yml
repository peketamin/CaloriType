name: Deploy CaloriType to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mockup/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          node --check mockup/storage.js
          node --check mockup/app.js
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the app
        uses: actions/upload-pages-artifact@v4
        with:
          path: mockup
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
