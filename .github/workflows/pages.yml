name: Deploy CaloriType to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mockup/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: node --check mockup/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the app
        uses: actions/upload-pages-artifact@v4
        with:
          path: mockup
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
